<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><style>
:root{color-scheme:light dark}body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:12px;background:transparent;color:CanvasText}body.dark{color-scheme:dark}body.light{color-scheme:light}label{display:block;font-weight:600;margin-top:12px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;padding:10px;border:1px solid GrayText;border-radius:6px;background:Canvas;color:CanvasText}button{min-height:44px;padding:8px 15px;margin:8px 4px 8px 0;border-radius:6px;border:1px solid GrayText;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1689d0;outline-offset:2px}article{border-top:1px solid GrayText;padding:12px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:6px 0}.reply{border-left:3px solid #1689d0;padding-left:12px}.trap{position:absolute;left:-9999px}small{display:block}button:disabled{opacity:.65;cursor:default}
</style></head><body data-page="<?= page ?>"><h2>Join the conversation</h2><p>Share an observation, question or constructive feedback. Comments are reviewed before publication. Do not include personal information or student records.</p><form id="form"><label for="name">Display name (optional)</label><input id="name" maxlength="60" autocomplete="nickname"><label for="comment">Comment</label><textarea id="comment" required minlength="5" maxlength="2000" rows="4"></textarea><div class="trap" aria-hidden="true"><label for="website">Leave empty</label><input id="website" tabindex="-1" autocomplete="off"></div><p id="replyTo" hidden></p><button type="button" id="cancel" hidden>Cancel reply</button><label><input id="consent" type="checkbox" required style="width:auto"> I understand my approved display name and comment will be public.</label><button id="submit">Submit for review</button><p role="status" id="status" aria-live="polite"></p></form><h3>Community discussion</h3><button id="refresh" type="button">Refresh comments</button><div id="comments" aria-live="polite">Loading comments…</div><script>
const $=id=>document.getElementById(id),page=document.body.dataset.page;let parent='',token;
try{token=localStorage.getItem('az-comment-token');if(!token){token=crypto.randomUUID();localStorage.setItem('az-comment-token',token)}}catch(e){token=crypto.randomUUID()}
const theme=new URLSearchParams(location.search).get('theme');if(theme==='dark'||theme==='light')document.body.classList.add(theme);
function resetReply(){parent='';$('replyTo').hidden=true;$('cancel').hidden=true}
$('cancel').onclick=resetReply;
function load(){google.script.run.withSuccessHandler(rows=>{const host=$('comments');host.replaceChildren();if(!rows.length){host.textContent='No approved comments yet. Be the first to contribute.';return;}const byParent=new Map();rows.forEach(r=>{const k=r.parent||'';if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(r)});const seen=new Set();function render(r,depth){if(seen.has(r.id))return;seen.add(r.id);const a=document.createElement('article');if(depth)a.className='reply';const name=document.createElement('strong');name.textContent=r.name;const date=document.createElement('small');date.textContent=r.date;const p=document.createElement('p');p.textContent=r.comment;a.append(name,date,p);if(r.reply){const h=document.createElement('strong');h.textContent='Amanda Zirzow · Site owner';const q=document.createElement('p');q.textContent=r.reply;a.append(h,q)}const b=document.createElement('button');b.textContent='Reply';b.onclick=()=>{parent=r.id;$('replyTo').textContent='Replying to '+r.name;$('replyTo').hidden=false;$('cancel').hidden=false;$('comment').focus()};a.append(b);host.append(a);(byParent.get(r.id)||[]).forEach(x=>render(x,depth+1))} (byParent.get('')||[]).forEach(x=>render(x,0));rows.forEach(x=>render(x,0));}).withFailureHandler(()=>{$('comments').textContent='Comments are temporarily unavailable.'}).listComments(page)}
$('refresh').onclick=load;$('form').onsubmit=e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Submitting…';google.script.run.withSuccessHandler(()=>{$('form').reset();resetReply();$('status').textContent='Thank you! Your comment is awaiting moderation.';$('submit').disabled=false}).withFailureHandler(()=>{$('status').textContent='Unable to submit. Please try again later.';$('submit').disabled=false}).submitComment({page,name:$('name').value,comment:$('comment').value,parent,website:$('website').value,token})};load();
</script></body></html>
